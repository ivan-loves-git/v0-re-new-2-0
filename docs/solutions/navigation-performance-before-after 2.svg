<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">Renew Platform navigation performance before and after</title>
  <desc id="desc">Grouped bar chart comparing the reported roughly 1000 millisecond before baseline with measured after route shell times for six dashboard navigation cases.</desc>
  <rect width="1100" height="680" fill="#ffffff"/>
  <text x="90" y="42" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Navigation response time by route</text>
  <text x="90" y="68" font-family="Inter, Arial, sans-serif" font-size="14" fill="#4b5563">Red = reported before baseline (~1000ms dead wait). Blue = measured after shell response in local production build.</text>

  <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">
    <line x1="90" y1="520" x2="1020" y2="520" stroke="#111827" stroke-width="1.5"/>
    <line x1="90" y1="100" x2="90" y2="520" stroke="#111827" stroke-width="1.5"/>

    <g stroke="#e5e7eb" stroke-width="1">
      <line x1="90" y1="520" x2="1020" y2="520"/>
      <line x1="90" y1="424.5" x2="1020" y2="424.5"/>
      <line x1="90" y1="329.1" x2="1020" y2="329.1"/>
      <line x1="90" y1="233.6" x2="1020" y2="233.6"/>
      <line x1="90" y1="138.2" x2="1020" y2="138.2"/>
    </g>

    <text x="80" y="524" text-anchor="end">0</text>
    <text x="80" y="428.5" text-anchor="end">250</text>
    <text x="80" y="333.1" text-anchor="end">500</text>
    <text x="80" y="237.6" text-anchor="end">750</text>
    <text x="80" y="142.2" text-anchor="end">1000</text>
    <text x="36" y="325" text-anchor="middle" transform="rotate(-90 36 325)">milliseconds</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="128" y="138.2" width="34" height="381.8" rx="4" fill="#e74c3c"/>
    <rect x="168" y="458.9" width="34" height="61.1" rx="4" fill="#2f80ed"/>
    <text x="145" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">1000</text>
    <text x="185" y="451" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">160</text>
    <text x="165" y="560" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Repreneurs</text>

    <rect x="283" y="138.2" width="34" height="381.8" rx="4" fill="#e74c3c"/>
    <rect x="323" y="466.2" width="34" height="53.8" rx="4" fill="#2f80ed"/>
    <text x="300" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">1000</text>
    <text x="340" y="458" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">141</text>
    <text x="320" y="560" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Pipeline</text>

    <rect x="438" y="138.2" width="34" height="381.8" rx="4" fill="#e74c3c"/>
    <rect x="478" y="470.7" width="34" height="49.3" rx="4" fill="#2f80ed"/>
    <text x="455" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">1000</text>
    <text x="495" y="463" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">129</text>
    <text x="475" y="560" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Analytics</text>

    <rect x="593" y="138.2" width="34" height="381.8" rx="4" fill="#e74c3c"/>
    <rect x="633" y="460.4" width="34" height="59.6" rx="4" fill="#2f80ed"/>
    <text x="610" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">1000</text>
    <text x="650" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">156</text>
    <text x="630" y="560" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Opp. Find</text>

    <rect x="748" y="138.2" width="34" height="381.8" rx="4" fill="#e74c3c"/>
    <rect x="788" y="454.7" width="34" height="65.3" rx="4" fill="#2f80ed"/>
    <text x="765" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">1000</text>
    <text x="805" y="447" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">171</text>
    <text x="785" y="560" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Dashboard</text>

    <rect x="903" y="138.2" width="34" height="381.8" rx="4" fill="#e74c3c"/>
    <rect x="943" y="460.0" width="34" height="60.0" rx="4" fill="#2f80ed"/>
    <text x="920" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">1000</text>
    <text x="960" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">157</text>
    <text x="940" y="560" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Detail</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#374151">
    <rect x="90" y="610" width="14" height="14" rx="3" fill="#e74c3c"/>
    <text x="112" y="622">Before: reported baseline (~1000ms)</text>
    <rect x="360" y="610" width="14" height="14" rx="3" fill="#2f80ed"/>
    <text x="382" y="622">After: measured route shell response</text>
  </g>

  <text x="90" y="650" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">Measured after values: Repreneurs 160ms, Pipeline 141ms, Analytics 129ms, Opportunities Find 156ms, Dashboard 171ms, Repreneur detail 157ms.</text>
</svg>
