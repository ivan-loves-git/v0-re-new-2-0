            --env RENEW_EXTERNAL_LDC_REHEARSAL=1 \
            postgres:17-bookworm \
            bash -lc 'PG_BIN=/usr/lib/postgresql/17/bin bash scripts/rehearse-external-pursuit-handoffs.sh'

      - name: "Rehearse #255 atomic external memo notices and legacy/future grant races"
        run: |
          docker run --rm \
