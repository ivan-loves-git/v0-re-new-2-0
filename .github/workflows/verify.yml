            postgres:17-bookworm \
            bash -lc 'PG_BIN=/usr/lib/postgresql/17/bin bash scripts/rehearse-external-pursuit-handoffs.sh'

      - name: "Rehearse #254 exact private LDC versions and cleanup/source races"
