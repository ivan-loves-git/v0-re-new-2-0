            bash -lc 'PG_BIN=/usr/lib/postgresql/17/bin bash scripts/rehearse-w169-lifecycle-outcomes.sh'

      - name: "Rehearse #185 recipient-bound IM lifecycle and Drop races"
        run: |
          docker run --rm \
            --user postgres \
