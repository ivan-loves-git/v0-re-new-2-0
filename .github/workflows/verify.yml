name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer candidate replaces only its own PR run. Main and explicitly
# dispatched runs each keep their coverage, without sharing a cancellation key.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://supabase.test.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      DATABASE_URL: postgresql://test:test@localhost:5432/renew_test
      BETTER_AUTH_SECRET: test-only-auth-secret-that-is-long-enough
      BETTER_AUTH_URL: https://app.re-new.team
      RESEND_API_KEY: test-resend-api-key
      RESEND_FROM_EMAIL: noreply@test.invalid
      CRON_SECRET: test-cron-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check authored commit messages
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          COMMIT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm commit:check --range "$COMMIT_BASE_SHA..$COMMIT_HEAD_SHA"

      - name: Audit production dependencies and verify repository
        run: pnpm verify

      - name: "Rehearse #121 guarded Match Fit provenance and independent-session races"
        run: |
          docker run --rm \
            --user postgres \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            --env TMPDIR=/tmp \
            postgres:17-bookworm \
            bash -lc 'PG_BIN=/usr/lib/postgresql/17/bin bash scripts/rehearse-match-fit-freshness.sh'

      - name: "Rehearse #136 future-only discovery digest and receipt fences"
        run: |
          docker run --rm \
            --user postgres \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            --env TMPDIR=/tmp \
            postgres:17-bookworm \
            bash -lc 'PG_BIN=/usr/lib/postgresql/17/bin bash scripts/rehearse-discovery-digest.sh'

      - name: Rehearse #186 private review queue and independent-session send race
        run: |
          docker run --rm \
            --user postgres \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            --env TMPDIR=/tmp \
            postgres:17-bookworm \
            bash -lc 'PG_BIN=/usr/lib/postgresql/17/bin bash scripts/rehearse-staff-email-review-queue.sh'

      - name: "Rehearse #224 bounded bulk claim and source reservation races"
        run: |
          docker run --rm \
            --user postgres \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            --env TMPDIR=/tmp \
            postgres:17-bookworm \
            bash -lc 'PG_BIN=/usr/lib/postgresql/17/bin bash scripts/rehearse-staff-email-bulk.sh'

      - name: "Rehearse #252 reasoned lifecycle and Stale activation races"
        run: |
          docker run --rm \
            --user postgres \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            --env TMPDIR=/tmp \
            postgres:17-bookworm \
