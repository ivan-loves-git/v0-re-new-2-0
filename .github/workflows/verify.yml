            bash -lc 'PG_BIN=/usr/lib/postgresql/17/bin bash scripts/rehearse-exact-source-correction.sh'

      - name: Rehearse W-173/W-196/W-192 exact interest decisions and withdrawal races
        run: |
          docker run --rm \
            --user postgres \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            --env TMPDIR=/tmp \
            --env RENEW_W173_REPO_ROOT=/workspace \
            postgres:17-bookworm \
            bash -lc 'PG_BIN=/usr/lib/postgresql/17/bin bash scripts/rehearse-w173-interest-decisions.sh'

      - name: Rehearse W-174 exact memo feedback and reminder fences
        run: |
          docker run --rm \
            --user postgres \
