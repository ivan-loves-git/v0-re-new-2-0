            postgres:17-bookworm \
            bash -lc 'PG_BIN=/usr/lib/postgresql/17/bin bash scripts/rehearse-paused-opportunity-history.sh'

      - name: Rehearse #186 actual M&A source send with email-only staff
        run: |
          docker run --rm \
            --user postgres \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            --env TMPDIR=/tmp \
            postgres:17-bookworm \
            bash -lc 'PG_BIN=/usr/lib/postgresql/17/bin bash scripts/rehearse-ma-interaction-persistence.sh'

      - name: Rehearse W-126 DEMO quarantine and portal response
        run: |
          docker run --rm \
            --user postgres \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
