            bash -lc 'PG_BIN=/usr/lib/postgresql/17/bin bash scripts/rehearse-pursuit-v4-clarifications.sh'

  w147-w148-database-rehearsal:
    name: W-147/W-148 database rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: w147-rehearsal-only
          POSTGRES_DB: w147_rehearsal
        options: >-
          --health-cmd "pg_isready -U postgres -d w147_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run W-147 and W-148 against disposable PostgreSQL 17
        shell: bash
        run: |
          service_id="${{ job.services.postgres.id }}"
          test -n "$service_id"
          docker exec "$service_id" mkdir -p /tmp/scripts /tmp/supabase/migrations
          docker cp supabase/migrations/20260824093456_close_legacy_auth_and_data_api.sql "$service_id:/tmp/w147-migration.sql"
          docker cp scripts/verify-w147-auth-data-api.sql "$service_id:/tmp/w147-verify.sql"
          docker cp scripts/rehearse-w148-private-cvs-storage.sql "$service_id:/tmp/scripts/rehearse-w148-private-cvs-storage.sql"
          docker cp supabase/migrations/20260824093630_w148_private_cvs_storage_boundary.sql "$service_id:/tmp/supabase/migrations/20260824093630_w148_private_cvs_storage_boundary.sql"
          docker exec \
            -e PGPASSWORD=w147-rehearsal-only \
            "$service_id" \
            psql -X -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 \
              -U postgres \
              -d w147_rehearsal \
              -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS; ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT ALL ON TABLES TO PUBLIC, anon, authenticated; ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT ALL ON SEQUENCES TO PUBLIC, anon, authenticated; ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO PUBLIC, anon, authenticated; CREATE TABLE notes(id serial); CREATE TABLE clipboard(id serial); CREATE TABLE pdr_feedback(id serial); CREATE TABLE pdr_goals(id serial); CREATE TABLE pdr_milestones(id serial); CREATE TABLE pdr_proposals(id serial); CREATE TABLE pdr_requests(id serial); CREATE TABLE pdr_work_cards(id serial); CREATE POLICY leaked ON notes FOR SELECT TO PUBLIC USING (true); CREATE FUNCTION public.leaked() RETURNS int LANGUAGE sql AS 'SELECT 1';" \
              -f /tmp/w147-migration.sql \
              -c "CREATE TABLE w147_future_table(id int); CREATE SEQUENCE w147_future_sequence; CREATE FUNCTION public.w147_future_function() RETURNS int LANGUAGE sql AS 'SELECT 1';" \
              -f /tmp/w147-verify.sql
          docker exec \
            -e PGPASSWORD=w147-rehearsal-only \
            "$service_id" \
            psql -X -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 \
              -U postgres \
              -d w147_rehearsal \
              -c "CREATE SCHEMA storage; CREATE TABLE storage.buckets(id text PRIMARY KEY, name text NOT NULL, public boolean NOT NULL DEFAULT false); CREATE TABLE storage.objects(id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY, bucket_id text NOT NULL, name text NOT NULL); ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;" \
              -f /tmp/scripts/rehearse-w148-private-cvs-storage.sql

  personal-review-database-rehearsal:
    name: Personal review database rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: review-rehearsal-only
          POSTGRES_DB: review157
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d review157"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify private personal review persistence and deletion
        run: node scripts/rehearsals/repreneur-personal-review.mjs
        env:
          REVIEW_TEST_PORT: 5432
          REVIEW_TEST_USER: postgres
          REVIEW_TEST_PASSWORD: review-rehearsal-only
          REVIEW_TEST_DATABASE: review157
