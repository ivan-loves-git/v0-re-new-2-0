name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://supabase.test.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      DATABASE_URL: postgresql://test:test@localhost:5432/renew_test
      BETTER_AUTH_SECRET: test-only-auth-secret-that-is-long-enough
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: test-resend-api-key
      RESEND_FROM_EMAIL: noreply@test.invalid
      CRON_SECRET: test-cron-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Report production dependency audit
        continue-on-error: true
        run: pnpm audit --prod

      - name: Install Chromium for generated trace verification
        run: pnpm exec playwright install --with-deps chromium

      - name: Run repository verification
        run: pnpm verify

  w147-w148-database-rehearsal:
    name: W-147/W-148 database rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: w147-rehearsal-only
          POSTGRES_DB: w147_rehearsal
        options: >-
          --health-cmd "pg_isready -U postgres -d w147_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run W-147 and W-148 against disposable PostgreSQL 17
        shell: bash
        run: |
          service_id="${{ job.services.postgres.id }}"
          test -n "$service_id"
          docker exec "$service_id" mkdir -p /tmp/scripts /tmp/supabase/migrations
          docker cp supabase/migrations/20260824093456_close_legacy_auth_and_data_api.sql "$service_id:/tmp/w147-migration.sql"
          docker cp scripts/verify-w147-auth-data-api.sql "$service_id:/tmp/w147-verify.sql"
          docker cp scripts/rehearse-w148-private-cvs-storage.sql "$service_id:/tmp/scripts/rehearse-w148-private-cvs-storage.sql"
          docker cp supabase/migrations/20260824093630_w148_private_cvs_storage_boundary.sql "$service_id:/tmp/supabase/migrations/20260824093630_w148_private_cvs_storage_boundary.sql"
          docker exec \
            -e PGPASSWORD=w147-rehearsal-only \
            "$service_id" \
            psql -X -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 \
              -U postgres \
              -d w147_rehearsal \
              -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS; ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT ALL ON TABLES TO PUBLIC, anon, authenticated; ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT ALL ON SEQUENCES TO PUBLIC, anon, authenticated; ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO PUBLIC, anon, authenticated; CREATE TABLE notes(id serial); CREATE TABLE clipboard(id serial); CREATE TABLE pdr_feedback(id serial); CREATE TABLE pdr_goals(id serial); CREATE TABLE pdr_milestones(id serial); CREATE TABLE pdr_proposals(id serial); CREATE TABLE pdr_requests(id serial); CREATE TABLE pdr_work_cards(id serial); CREATE POLICY leaked ON notes FOR SELECT TO PUBLIC USING (true); CREATE FUNCTION public.leaked() RETURNS int LANGUAGE sql AS 'SELECT 1';" \
              -f /tmp/w147-migration.sql \
              -c "CREATE TABLE w147_future_table(id int); CREATE SEQUENCE w147_future_sequence; CREATE FUNCTION public.w147_future_function() RETURNS int LANGUAGE sql AS 'SELECT 1';" \
              -f /tmp/w147-verify.sql
          docker exec \
            -e PGPASSWORD=w147-rehearsal-only \
            "$service_id" \
            psql -X -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 \
              -U postgres \
              -d w147_rehearsal \
              -c "CREATE SCHEMA storage; CREATE TABLE storage.buckets(id text PRIMARY KEY, name text NOT NULL, public boolean NOT NULL DEFAULT false); CREATE TABLE storage.objects(id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY, bucket_id text NOT NULL, name text NOT NULL); ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;" \
              -f /tmp/scripts/rehearse-w148-private-cvs-storage.sql


  w147-live-rest-proof:
    name: W-147 production REST proof (diagnostic only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/w147-live-rest-proof-20260824'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      W147_PROJECT_URL: https://iiuqcdnmxhtyispnykgf.supabase.co
      W147_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      W147_EXPECTED_KEY_SHA256: 5527e7da1605f27223eec33bc15d6f4ebeff0f686bb80edc1069f1b645d6489f
    steps:
      - name: Prove production browser-role REST boundary
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${W147_PUBLISHABLE_KEY:-}" ]]; then
            printf '%s\n' 'production_publishable_key_missing'
            exit 1
          fi
          printf '::add-mask::%s\n' "$W147_PUBLISHABLE_KEY"
          actual_sha="$(printf '%s' "$W147_PUBLISHABLE_KEY" | sha256sum | awk '{print $1}')"
          test "$actual_sha" = "$W147_EXPECTED_KEY_SHA256"

          probe() {
            local label="$1"
            local method="$2"
            local path="$3"
            local expectation="$4"
            local body="${5:-}"
            local status
            local -a args=(
              --silent
              --show-error
              --retry 2
              --retry-all-errors
              --max-time 20
              --output /dev/null
              --write-out '%{http_code}'
              --request "$method"
              --header "apikey: $W147_PUBLISHABLE_KEY"
              --header "authorization: Bearer $W147_PUBLISHABLE_KEY"
              --header 'accept: application/json'
            )
            if [[ -n "$body" ]]; then
              args+=(--header 'content-type: application/json' --data "$body")
            fi
            status="$(curl "${args[@]}" "${W147_PROJECT_URL}${path}")"
            printf '%s=%s\n' "$label" "$status"
            if [[ "$expectation" = '200' ]]; then
              test "$status" = '200'
            else
              [[ "$status" =~ ^[1-5][0-9]{2}$ ]]
              [[ "${status:0:1}" != '2' ]]
            fi
          }

          probe private_relation_repreneurs GET '/rest/v1/repreneurs?select=*&limit=0' non2xx
          probe private_rpc_wave_journey POST '/rest/v1/rpc/wave_journey_is_enabled' non2xx '{}'
          probe public_read_clipboard GET '/rest/v1/clipboard?select=*&limit=0' 200
          probe public_read_pdr_feedback GET '/rest/v1/pdr_feedback?select=*&limit=0' 200
          probe public_read_pdr_goals GET '/rest/v1/pdr_goals?select=*&limit=0' 200
          probe public_read_pdr_milestones GET '/rest/v1/pdr_milestones?select=*&limit=0' 200
          probe public_read_pdr_proposals GET '/rest/v1/pdr_proposals?select=*&limit=0' 200
          probe public_read_pdr_requests GET '/rest/v1/pdr_requests?select=*&limit=0' 200
          probe public_read_pdr_work_cards GET '/rest/v1/pdr_work_cards?select=*&limit=0' 200
