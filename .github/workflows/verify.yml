            bash -lc 'PG_BIN=/usr/lib/postgresql/17/bin bash scripts/rehearse-recipient-information-memos.sh'

      - name: "Rehearse #191 exact source correction and independent-session races"
        run: |
          docker run --rm \
            --user postgres \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
