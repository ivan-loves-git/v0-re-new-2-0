name: Golden journeys

on:
  workflow_dispatch:
    inputs:
      candidate_branch:
        description: Exact same-repository candidate branch
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string
      verify_run_id:
        description: Exact green Verify run id for that SHA
        required: true
        type: string
      contract_sha256:
        description: Required only for reviewed schema transitions
        required: false
        type: string
      schema_reviewed:
        description: Set true only for reviewed schema transitions
        required: false
        type: boolean
        default: false
      schema_review_version:
        description: Must be qa-schema-review-v1 for schema transitions
        required: false
        type: string
      pause_after_lease:
        description: Serialization proof pause
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  deployments: read

concurrency:
  group: renew-permanent-qa
  cancel-in-progress: false

env:
  CI: "true"
  QA_STABLE_ORIGIN: https://renew-overnight-validation-git-59fa20-myworkmail4-pngs-projects.vercel.app
  QA_VALIDATION_PROJECT: renew-overnight-validation-20260820

jobs:
  lane:
    name: Admit exact candidate
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      candidate_branch: ${{ steps.candidate.outputs.candidate_branch }}
      reviewed_schema_transition: ${{ steps.candidate.outputs.reviewed_schema_transition }}
      check_run_id: ${{ steps.check.outputs.check_run_id }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      QA_CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
      QA_EXPECTED_SHA: ${{ inputs.candidate_sha }}
      QA_VERIFY_RUN_ID: ${{ inputs.verify_run_id }}
      QA_CONTRACT_SHA256: ${{ inputs.contract_sha256 }}
      QA_SCHEMA_REVIEWED: ${{ inputs.schema_reviewed }}
      QA_SCHEMA_REVIEW_VERSION: ${{ inputs.schema_review_version }}
      QA_CANDIDATE_ROOT: .qa-candidate
    steps:
      - name: Check out trusted lane controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Check out candidate database contract as untrusted data
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_EXPECTED_SHA }}
          path: .qa-candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Validate candidate database contract admission and exact branch head
        id: candidate
        run: node scripts/qa/validate-candidate.mjs

      - name: Attach protected check to exact candidate
        id: check
        run: node scripts/qa/candidate-check.mjs create

      - name: Require current-main health or reviewed transition recovery
        id: health
        shell: bash
        env:
          QA_REVIEWED_SCHEMA_TRANSITION: ${{ steps.candidate.outputs.reviewed_schema_transition }}
        run: |
          IFS=$'\t' read -r conclusion health_created_at health_branch health_sha health_event health_workflow <<< "$(gh run list --workflow qa-daily-health.yml --status completed --limit 1 --json conclusion,createdAt,headBranch,headSha,event,workflowName --jq '.[0] | [.conclusion,.createdAt,.headBranch,.headSha,.event,.workflowName] | @tsv')"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          health_ok="false"
          health_failure="A completed successful daily QA health run is required"
          if [ "$conclusion" = "success" ] && [ -n "$health_created_at" ] && [ "$health_branch" = "main" ] && [ "$health_sha" = "$current_main" ] && [ "$health_workflow" = "QA daily health" ]; then
            case "$health_event" in
              schedule|workflow_dispatch)
                age_seconds="$(( $(date -u +%s) - $(date -u -d "$health_created_at" +%s) ))"
                if [ "$age_seconds" -ge 0 ] && [ "$age_seconds" -le 93600 ]; then
                  health_ok="true"
                else
                  health_failure="Latest daily QA health is stale: health-created-at=$health_created_at"
                fi
                ;;
              *) health_failure="Daily QA health provenance is invalid" ;;
            esac
          fi
          if [ "$health_ok" = "true" ]; then
            printf 'recovery_used=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$QA_REVIEWED_SCHEMA_TRANSITION" != "true" ]; then
            printf '%s\n' "$health_failure" >&2
            exit 1
          fi
          printf 'recovery_used=true\n' >> "$GITHUB_OUTPUT"

      - name: Record reviewed schema transition recovery (not a product-test bypass)
        if: ${{ steps.health.outputs.recovery_used == 'true' }}
        shell: bash
        run: printf '%s\n' 'Reviewed schema transition recovery path used; this does not bypass product tests.' >> "$GITHUB_STEP_SUMMARY"

  deploy-qa:
    name: Deploy admitted candidate to validation project
    if: ${{ github.run_attempt == '1' && needs.lane.result == 'success' }}
    permissions:
      contents: read
      actions: write
    needs: lane
    runs-on: ubuntu-latest
    # Eight minutes for provider readiness plus two minutes for alias convergence;
    # the remaining five minutes cover trusted checkout, dependency install and evidence upload.
    timeout-minutes: 15
    environment: qa-pilot
    outputs:
      ready_at: ${{ steps.deployment.outputs.ready_at }}
      deployment_id: ${{ steps.deployment.outputs.deployment_id }}
      candidate_sha: ${{ steps.deployment.outputs.candidate_sha }}
      git_ref: ${{ steps.deployment.outputs.git_ref }}
    env:
      QA_EXPECTED_SHA: ${{ needs.lane.outputs.candidate_sha }}
      QA_CANDIDATE_BRANCH: ${{ needs.lane.outputs.candidate_branch }}
      QA_VERCEL_TOKEN: ${{ secrets.QA_VERCEL_TOKEN }}
      QA_VERCEL_TEAM_ID: ${{ secrets.QA_VERCEL_TEAM_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      QA_PROVIDER_EVIDENCE_FILE: .qa-deploy/provider-evidence.json
    steps:
      - name: Check out trusted deploy controller only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Explicitly deploy admitted candidate branch and SHA
        id: deployment
        run: node scripts/qa/deploy-admitted-candidate.mjs

      - name: Upload sanitized provider deploy evidence
        uses: actions/upload-artifact@v4
        with:
          name: qa-provider-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qa-deploy/provider-evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  schema-sync:
    name: Synchronize candidate database contract
    if: ${{ github.run_attempt == '1' && needs.lane.result == 'success' && needs.deploy-qa.result == 'success' }}
    permissions:
      contents: read
    needs: [lane, deploy-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: qa-pilot
    outputs:
      ready_at: ${{ needs.deploy-qa.outputs.ready_at }}
      deployment_id: ${{ steps.evidence.outputs.deployment_id }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      QA_EXPECTED_SHA: ${{ needs.lane.outputs.candidate_sha }}
      QA_CANDIDATE_BRANCH: ${{ needs.lane.outputs.candidate_branch }}
      QA_VERCEL_DEPLOYMENT_ID: ${{ needs.deploy-qa.outputs.deployment_id }}
      QA_SUPABASE_PROJECT_REF: ${{ secrets.QA_SUPABASE_PROJECT_REF }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      QA_DATABASE_CA_CERT_FILE: .qa-run/supabase-ca.crt
      QA_CANDIDATE_ROOT: .qa-candidate
      QA_PROVIDER_EVIDENCE_FILE: .qa-deploy/provider-evidence.json
    steps:
      - name: Check out trusted QA controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Check out authorized candidate contract as data
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.lane.outputs.candidate_sha }}
          path: .qa-candidate
          fetch-depth: 2

      - name: Download sanitized provider deploy evidence
        uses: actions/download-artifact@v4
        with:
          name: qa-provider-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qa-deploy

      - name: Load provider evidence without Vercel token
        id: evidence
        run: node scripts/qa/load-provider-evidence.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare private database transport
        shell: bash
        run: |
          umask 077
          mkdir -p .qa-run
          curl --fail --silent --show-error https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt -o "$QA_DATABASE_CA_CERT_FILE"

      - name: Verify deployed application identities before database mutation
        run: pnpm qa:deployed-contract:verify

      - name: Verify candidate schema artifact
        run: pnpm qa:schema:verify

      - name: Synchronize only the empty approved QA branch
        run: pnpm qa:schema:sync

  golden:
    name: Run protected P1-P3 on permanent QA
    if: ${{ github.run_attempt == '1' && needs.lane.result == 'success' && needs.deploy-qa.result == 'success' && needs.schema-sync.result == 'success' }}
    permissions:
      contents: read
      actions: write
    needs: [lane, deploy-qa, schema-sync]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: qa-pilot
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BETTER_AUTH_URL: https://renew-overnight-validation-git-59fa20-myworkmail4-pngs-projects.vercel.app
      NEXT_PUBLIC_APP_URL: https://renew-overnight-validation-git-59fa20-myworkmail4-pngs-projects.vercel.app
      QA_BROWSER_BASE_URL: https://renew-overnight-validation-git-59fa20-myworkmail4-pngs-projects.vercel.app
      QA_VALIDATION_ORIGIN: https://renew-overnight-validation-git-59fa20-myworkmail4-pngs-projects.vercel.app
      QA_SUPABASE_PROJECT_REF: ${{ secrets.QA_SUPABASE_PROJECT_REF }}
      QA_EMAIL_RECIPIENT: ${{ secrets.QA_EMAIL_RECIPIENT }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      QA_EXPECTED_SHA: ${{ needs.lane.outputs.candidate_sha }}
      QA_CANDIDATE_BRANCH: ${{ needs.lane.outputs.candidate_branch }}
      QA_VERCEL_DEPLOYMENT_ID: ${{ needs.deploy-qa.outputs.deployment_id }}
      QA_PROVIDER_EVIDENCE_FILE: .qa-deploy/provider-evidence.json

      QA_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      QA_FIXTURE_PREFIX: TEST-gh-${{ github.run_id }}-${{ github.run_attempt }}
      QA_RUN_DIR: .qa-run
      QA_FIXTURE_MANIFEST_FILE: .qa-run/manifest.json
      QA_PREFLIGHT_EVIDENCE_FILE: .qa-run/live-preflight.json
      QA_DATABASE_CA_CERT_FILE: .qa-run/supabase-ca.crt
      QA_CREDENTIALS_FILE: .qa-run/credentials.json
      QA_CASE_RESULT_FILE: .qa-run/case-result.json
      GITHUB_TOKEN: ${{ github.token }}
      QA_CANDIDATE_ROOT: .qa-candidate
    steps:
      - name: Check out trusted QA controller and journeys
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Check out authorized candidate contract as data
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.lane.outputs.candidate_sha }}
          path: .qa-candidate
          fetch-depth: 2

      - name: Download sanitized provider deploy evidence
        uses: actions/download-artifact@v4
        with:
          name: qa-provider-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qa-deploy

      - name: Load provider evidence without Vercel token
        run: node scripts/qa/load-provider-evidence.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium only
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare private runner evidence and lease owner
        shell: bash
        run: |
          umask 077
          mkdir -p .qa-run
          curl --fail --silent --show-error https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt -o "$QA_DATABASE_CA_CERT_FILE"
          printf 'QA_LEASE_OWNER=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          pnpm qa:fixture:manifest

      - name: Collect deployed and provider identity before recovery
        run: pnpm qa:evidence:collect
        env:
          QA_EVIDENCE_MODE: identity

      - name: Verify live isolation preflight
        run: pnpm qa:preflight-isolation

      - name: Acquire or safely recover database lease
        id: lease
        run: pnpm qa:lease:acquire

      - name: Require empty baseline after recovery
        run: pnpm qa:evidence:collect

      - name: Pause after lease for serialization proof
        if: inputs.pause_after_lease == true
        run: sleep 180

      - name: Seed exact Playwright fixtures
        id: seed
        run: pnpm qa:fixture:seed

      - name: Heartbeat before browser execution
        run: pnpm qa:lease:heartbeat

      - name: Run P1-P3 in protected Chromium
        run: pnpm qa:browser

      - name: Enforce first-attempt P1-P3 evidence
        run: pnpm qa:browser:clean-run

      - name: Read back exact persisted acceptance state
        run: pnpm qa:fixture:readback

      - name: Cleanup exact manifest and label-owned fixtures
        id: cleanup
        if: ${{ always() && steps.lease.outcome == 'success' && steps.seed.outcome != 'skipped' }}
        run: pnpm qa:fixture:cleanup

      - name: Verify entire QA baseline is empty after cleanup
        id: empty
        if: ${{ always() && steps.cleanup.outcome == 'success' }}
        run: pnpm qa:evidence:collect

      - name: Release unused lease before fixture mutation
        if: ${{ always() && steps.lease.outcome == 'success' && steps.seed.outcome == 'skipped' }}
        run: pnpm qa:lease:release

      - name: Release lease only after zero residue
        if: ${{ always() && steps.cleanup.outcome == 'success' && steps.empty.outcome == 'success' }}
        run: pnpm qa:lease:release

      - name: Sanitize runner artifacts
        id: sanitize
        if: always()
        run: pnpm qa:artifacts:sanitize

      - name: Upload sanitized evidence
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-journeys-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qa-run
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  finalize:
    name: Finalize exact candidate check
    permissions:
      contents: read
      actions: write
      checks: write
    if: ${{ always() && github.run_attempt == '1' }}
    needs: [lane, deploy-qa, schema-sync, golden]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GITHUB_TOKEN: ${{ github.token }}
      QA_EXPECTED_SHA: ${{ needs.lane.outputs.candidate_sha }}
      QA_CHECK_RUN_ID: ${{ needs.lane.outputs.check_run_id }}
      QA_CHECK_CONCLUSION: ${{ needs.deploy-qa.result == 'success' && needs.schema-sync.result == 'success' && needs.golden.result == 'success' && 'success' || 'failure' }}
      QA_DEPLOYMENT_READY_AT: ${{ needs.deploy-qa.outputs.ready_at }}
      QA_CHECK_SUMMARY: deploy=${{ needs.deploy-qa.result }}; schema=${{ needs.schema-sync.result }}; golden=${{ needs.golden.result }}; deployment-ready=${{ needs.deploy-qa.outputs.ready_at }}
    steps:
      - name: Check out trusted check finalizer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Preserve strict P1-P3 result on candidate SHA
        if: ${{ needs.lane.outputs.check_run_id != '' }}
        run: node scripts/qa/candidate-check.mjs update

      - name: Upload exact lane timing
        if: ${{ always() && needs.lane.outputs.check_run_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-lane-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qa-final/lane-timing.json
          if-no-files-found: error
          retention-days: 1
