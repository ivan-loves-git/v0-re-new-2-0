name: Golden journeys

on:
  workflow_dispatch:
    inputs:
      candidate_branch:
        description: Exact same-repository candidate branch
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string
      verify_run_id:
        description: Exact green Verify run id for that SHA
        required: true
        type: string
      contract_sha256:
        description: Required only for reviewed schema transitions
        required: false
        type: string
      schema_reviewed:
        description: Set true only for reviewed schema transitions
        required: false
        type: boolean
        default: false
      schema_review_version:
        description: Must be qa-schema-review-v1 for schema transitions
        required: false
        type: string
      pause_after_lease:
        description: Serialization proof pause
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: renew-permanent-qa
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  lane:
    name: Admit exact candidate
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      candidate_branch: ${{ steps.candidate.outputs.candidate_branch }}
      reviewed_schema_transition: ${{ steps.candidate.outputs.reviewed_schema_transition }}
      check_run_id: ${{ steps.check.outputs.check_run_id }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      QA_CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
      QA_EXPECTED_SHA: ${{ inputs.candidate_sha }}
      QA_VERIFY_RUN_ID: ${{ inputs.verify_run_id }}
      QA_CONTRACT_SHA256: ${{ inputs.contract_sha256 }}
      QA_SCHEMA_REVIEWED: ${{ inputs.schema_reviewed }}
      QA_SCHEMA_REVIEW_VERSION: ${{ inputs.schema_review_version }}
      QA_CANDIDATE_ROOT: .qa-candidate
    steps:
      - name: Check out trusted lane controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Check out candidate database contract as untrusted data
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_EXPECTED_SHA }}
          path: .qa-candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Validate candidate database contract admission and exact branch head
        id: candidate
        run: node scripts/qa/validate-candidate.mjs

      - name: Attach protected check to exact candidate
        id: check
        run: node scripts/qa/candidate-check.mjs create

  schema-sync:
    name: Synchronize candidate database contract
    if: ${{ github.run_attempt == '1' && needs.lane.result == 'success' }}
    permissions:
      contents: read
    needs: lane
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: qa-pilot
    env:
      QA_EXPECTED_SHA: ${{ needs.lane.outputs.candidate_sha }}
      QA_CANDIDATE_BRANCH: ${{ needs.lane.outputs.candidate_branch }}
      QA_SUPABASE_PROJECT_REF: ${{ secrets.QA_SUPABASE_PROJECT_REF }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      QA_DATABASE_CA_CERT_FILE: .qa-run/supabase-ca.crt
      QA_CANDIDATE_ROOT: .qa-candidate
    steps:
      - name: Check out trusted QA controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Check out authorized candidate contract as data
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.lane.outputs.candidate_sha }}
          path: .qa-candidate
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare private database transport
        shell: bash
        run: |
          umask 077
          mkdir -p .qa-run
          curl --fail --silent --show-error https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt -o "$QA_DATABASE_CA_CERT_FILE"

      - name: Verify candidate schema artifact
        run: pnpm qa:schema:verify

      - name: Synchronize only the empty approved QA branch
        run: pnpm qa:schema:sync

  golden:
    name: Run exact-candidate P1-P3 on isolated QA
    if: ${{ github.run_attempt == '1' && needs.lane.result == 'success' && needs.schema-sync.result == 'success' }}
    permissions:
      contents: read
    needs: [lane, schema-sync]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: qa-pilot
    outputs:
      runtime_ready_at: ${{ steps.runtime.outputs.ready_at }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BETTER_AUTH_URL: https://127.0.0.1:3443
      NEXT_PUBLIC_APP_URL: https://127.0.0.1:3443
      QA_BROWSER_BASE_URL: https://127.0.0.1:3443
      QA_VALIDATION_ORIGIN: https://127.0.0.1:3443
      QA_SUPABASE_PROJECT_REF: ${{ secrets.QA_SUPABASE_PROJECT_REF }}
      QA_EMAIL_RECIPIENT: ${{ secrets.QA_EMAIL_RECIPIENT }}
      QA_EXPECTED_SHA: ${{ needs.lane.outputs.candidate_sha }}
      QA_CANDIDATE_BRANCH: ${{ needs.lane.outputs.candidate_branch }}
      QA_EXECUTION_MODE: github-runner
      QA_CONTRACT_MODE: protected
      QA_MAIL_MODE: allowlist
      QA_MAIL_TRANSPORT: simulated

      QA_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      QA_FIXTURE_PREFIX: TEST-gh-${{ github.run_id }}-${{ github.run_attempt }}
      QA_RUN_DIR: .qa-run
      QA_FIXTURE_MANIFEST_FILE: .qa-run/manifest.json
      QA_PREFLIGHT_EVIDENCE_FILE: .qa-run/live-preflight.json
      QA_DATABASE_CA_CERT_FILE: .qa-run/supabase-ca.crt
      QA_CREDENTIALS_FILE: .qa-run/credentials.json
      QA_CASE_RESULT_FILE: .qa-run/case-result.json
      QA_CANDIDATE_ROOT: .
      QA_LOOPBACK_PROXY_TARGET: http://127.0.0.1:3000
      QA_LOOPBACK_PROXY_BIND: 127.0.0.1
      QA_LOOPBACK_PROXY_PORT: "3443"
    steps:
      - name: Check out exact authorized candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.lane.outputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium only
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare private runner, TLS and lease owner
        shell: bash
        run: |
          umask 077
          runtime_dir="$RUNNER_TEMP/renew-qa-loopback"
          certificate_file="$runtime_dir/loopback.crt"
          key_file="$runtime_dir/loopback.key"
          mkdir -p .qa-run
          mkdir -p "$runtime_dir"
          curl --fail --silent --show-error https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt -o "$QA_DATABASE_CA_CERT_FILE"
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout "$key_file" \
            -out "$certificate_file" \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" >/dev/null 2>&1
          {
            printf 'QA_LOOPBACK_PROXY_CERT_FILE=%s\n' "$certificate_file"
            printf 'QA_LOOPBACK_PROXY_KEY_FILE=%s\n' "$key_file"
            printf 'NODE_EXTRA_CA_CERTS=%s\n' "$certificate_file"
            printf 'BETTER_AUTH_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'CRON_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'QA_LEASE_OWNER=%s\n' "$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
          pnpm qa:fixture:manifest

      - name: Build exact candidate once
        run: pnpm build

      - name: Start loopback-only HTTPS candidate runtime
        id: runtime
        shell: bash
        run: |
          runtime_dir="$(dirname "$QA_LOOPBACK_PROXY_CERT_FILE")"
          pnpm start --hostname 127.0.0.1 --port 3000 >"$runtime_dir/app.log" 2>&1 &
          app_pid=$!
          node scripts/qa/loopback-https-proxy.mjs >"$runtime_dir/proxy.log" 2>&1 &
          proxy_pid=$!
          printf 'QA_APP_PID=%s\n' "$app_pid" >> "$GITHUB_ENV"
          printf 'QA_PROXY_PID=%s\n' "$proxy_pid" >> "$GITHUB_ENV"
          ready="false"
          for _ in $(seq 1 60); do
            if ! kill -0 "$app_pid" 2>/dev/null || ! kill -0 "$proxy_pid" 2>/dev/null; then break; fi
            served_sha="$(curl --cacert "$QA_LOOPBACK_PROXY_CERT_FILE" --silent --show-error --dump-header - --output /dev/null "$QA_BROWSER_BASE_URL/intake-v2" 2>/dev/null | tr -d '\r' | awk 'tolower($1) == "x-renew-deployment-sha:" { print $2; exit }')"
            if [ "$served_sha" = "$QA_EXPECTED_SHA" ]; then ready="true"; break; fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            printf '%s\n' 'Exact-candidate loopback runtime failed to become ready.' >&2
            exit 1
          fi
          ready_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'ready_at=%s\n' "$ready_at" >> "$GITHUB_OUTPUT"

      - name: Collect exact runner identity before recovery
        run: pnpm qa:evidence:collect
        env:
          QA_EVIDENCE_MODE: identity

      - name: Verify live isolation preflight
        run: pnpm qa:preflight-isolation

      - name: Acquire or safely recover database lease
        id: lease
        run: pnpm qa:lease:acquire

      - name: Require empty baseline after recovery
        run: pnpm qa:evidence:collect

      - name: Pause after lease for serialization proof
        if: inputs.pause_after_lease == true
        run: sleep 180

      - name: Seed exact Playwright fixtures
        id: seed
        run: pnpm qa:fixture:seed

      - name: Heartbeat before browser execution
        run: pnpm qa:lease:heartbeat

      - name: Run P1-P3 in Chromium
        run: pnpm qa:browser

      - name: Enforce first-attempt P1-P3 evidence
        run: pnpm qa:browser:clean-run

      - name: Read back exact persisted acceptance state
        run: pnpm qa:fixture:readback

      - name: Cleanup exact manifest and label-owned fixtures
        id: cleanup
        if: ${{ always() && steps.lease.outcome == 'success' && steps.seed.outcome != 'skipped' }}
        run: pnpm qa:fixture:cleanup

      - name: Verify entire QA baseline is empty after cleanup
        id: empty
        if: ${{ always() && steps.cleanup.outcome == 'success' }}
        run: pnpm qa:evidence:collect

      - name: Release unused lease before fixture mutation
        if: ${{ always() && steps.lease.outcome == 'success' && steps.seed.outcome == 'skipped' }}
        run: pnpm qa:lease:release

      - name: Release lease only after zero residue
        if: ${{ always() && steps.cleanup.outcome == 'success' && steps.empty.outcome == 'success' }}
        run: pnpm qa:lease:release

      - name: Stop and remove private loopback runtime
        if: always()
        shell: bash
        run: |
          for pid in "${QA_PROXY_PID:-}" "${QA_APP_PID:-}"; do
            if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; fi
          done
          for pid in "${QA_PROXY_PID:-}" "${QA_APP_PID:-}"; do
            if [ -n "$pid" ]; then wait "$pid" 2>/dev/null || true; fi
          done
          if [ -n "${QA_LOOPBACK_PROXY_CERT_FILE:-}" ]; then
            rm -rf "$(dirname "$QA_LOOPBACK_PROXY_CERT_FILE")"
          fi

      - name: Sanitize runner artifacts
        id: sanitize
        if: always()
        run: pnpm qa:artifacts:sanitize

      - name: Upload sanitized evidence
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-journeys-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qa-run
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  finalize:
    name: Finalize exact candidate check
    permissions:
      contents: read
      actions: write
      checks: write
    if: ${{ always() && github.run_attempt == '1' }}
    needs: [lane, schema-sync, golden]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GITHUB_TOKEN: ${{ github.token }}
      QA_EXPECTED_SHA: ${{ needs.lane.outputs.candidate_sha }}
      QA_CHECK_RUN_ID: ${{ needs.lane.outputs.check_run_id }}
      QA_CHECK_CONCLUSION: ${{ needs.schema-sync.result == 'success' && needs.golden.result == 'success' && 'success' || 'failure' }}
      QA_RUNTIME_READY_AT: ${{ needs.golden.outputs.runtime_ready_at }}
      QA_CHECK_SUMMARY: execution=github-runner; schema=${{ needs.schema-sync.result }}; golden=${{ needs.golden.result }}
    steps:
      - name: Check out trusted check finalizer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Preserve strict P1-P3 result on candidate SHA
        if: ${{ needs.lane.outputs.check_run_id != '' }}
        run: node scripts/qa/candidate-check.mjs update

      - name: Upload exact lane timing
        if: ${{ always() && needs.lane.outputs.check_run_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-lane-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qa-final/lane-timing.json
          if-no-files-found: error
          retention-days: 1
