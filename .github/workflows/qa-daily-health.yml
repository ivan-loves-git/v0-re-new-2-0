name: QA daily health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read
  deployments: read

concurrency:
  group: renew-permanent-qa
  cancel-in-progress: false

jobs:
  resolve-sha:
    name: Resolve deployed SHA from stable alias
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: qa-pilot
    outputs:
      sha: ${{ steps.alias.outputs.sha }}
    env:
      CI: "true"
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Refuse an untrusted health controller ref
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)"

      - name: Check out trusted QA controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve expected SHA from stable alias
        id: alias
        run: node scripts/qa/resolve-alias-sha.mjs

  health:
    name: Permanent QA health
    needs: resolve-sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: qa-pilot
    env:
      CI: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BETTER_AUTH_URL: https://renew-overnight-validation-git-59fa20-myworkmail4-pngs-projects.vercel.app
      NEXT_PUBLIC_APP_URL: https://renew-overnight-validation-git-59fa20-myworkmail4-pngs-projects.vercel.app
      QA_BROWSER_BASE_URL: https://renew-overnight-validation-git-59fa20-myworkmail4-pngs-projects.vercel.app
      QA_VALIDATION_ORIGIN: https://renew-overnight-validation-git-59fa20-myworkmail4-pngs-projects.vercel.app
      QA_SUPABASE_PROJECT_REF: ${{ secrets.QA_SUPABASE_PROJECT_REF }}
      QA_EMAIL_RECIPIENT: ${{ secrets.QA_EMAIL_RECIPIENT }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      QA_EXPECTED_SHA: ${{ needs.resolve-sha.outputs.sha }}
      QA_RUN_ID: health-${{ github.run_id }}-${{ github.run_attempt }}
      QA_FIXTURE_PREFIX: TEST-health-${{ github.run_id }}-${{ github.run_attempt }}
      QA_RUN_DIR: .qa-run
      QA_PREFLIGHT_EVIDENCE_FILE: .qa-run/live-preflight.json
      QA_DATABASE_CA_CERT_FILE: .qa-run/supabase-ca.crt
      GITHUB_TOKEN: ${{ github.token }}
      QA_CANDIDATE_ROOT: .qa-candidate
    steps:
      - name: Refuse an untrusted health controller ref
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)"
          test "${#QA_EXPECTED_SHA}" -eq 40

      - name: Check out trusted QA controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Check out deployed candidate contract as data
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-sha.outputs.sha }}
          path: .qa-candidate
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare private health state
        shell: bash
        run: |
          umask 077
          mkdir -p .qa-run
          curl --fail --silent --show-error https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt -o "$QA_DATABASE_CA_CERT_FILE"
          printf 'QA_LEASE_OWNER=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Verify candidate schema artifact
        run: pnpm qa:schema:verify

      - name: Verify deployed application identities before any mutation
        run: pnpm qa:deployed-contract:verify

      - name: Check protected site, provider identity and structure before recovery
        run: pnpm qa:evidence:collect
        env:
          QA_EVIDENCE_MODE: identity

      - name: Acquire or recover cleanup lease
        id: lease
        run: pnpm qa:lease:acquire

      - name: Require empty baseline after recovery
        id: empty
        run: pnpm qa:evidence:collect

      - name: Prove lease heartbeat
        id: heartbeat
        if: ${{ steps.lease.outcome == 'success' }}
        run: pnpm qa:lease:heartbeat

      - name: Release clean health lease
        if: ${{ always() && steps.lease.outcome == 'success' && steps.empty.outcome == 'success' && steps.heartbeat.outcome == 'success' }}
        run: pnpm qa:lease:release
